<head>

<style>
  :root{
    --red:#cf190c; --red-dark:#9e0f05; --gold:#ffbd59; --gold-deep:#f2a52d;
    --ink:#251712; --ink-soft:#5b4a43; --cream:#fff8ef; --line:#f0dcc4; --white:#fff;
    --font-title:"Fredoka","Trebuchet MS",sans-serif; --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--font-body);color:var(--ink);line-height:1.6;
    background:radial-gradient(1100px 600px at 50% -5%,#fff2df,transparent) fixed,var(--cream);
    -webkit-font-smoothing:antialiased}
  .hero-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px}
  .reviews{max-width:820px;margin:0 auto;padding:6px 18px 64px}
  .reviews-title{font-family:var(--font-title);font-weight:600;text-align:center;color:var(--ink);
    font-size:clamp(1.4rem,5vw,1.8rem);margin:0 0 22px}
  .flag{position:fixed;top:0;left:0;right:0;height:6px;z-index:5;
    background:linear-gradient(90deg,var(--red) 0 33.33%,var(--gold) 33.33% 66.66%,var(--red) 66.66% 100%)}

  .card{width:100%;max-width:520px;background:var(--white);border:1px solid var(--line);
    border-radius:30px;box-shadow:0 30px 70px rgba(120,40,10,.18);padding:44px 34px 38px;text-align:center;
    position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(90deg,var(--red),var(--gold))}

  .logo{width:96px;height:auto;margin:6px auto 4px;display:block}
  .brand{font-family:var(--font-title);font-weight:600;font-size:1.05rem;color:var(--ink);margin-bottom:22px}
  .brand span{color:var(--red)}

  .stars{display:flex;justify-content:center;gap:7px;margin:0 0 18px}
  .stars svg{width:38px;height:38px;fill:var(--gold);filter:drop-shadow(0 3px 5px rgba(242,165,45,.5));
    opacity:0;transform:scale(.4) translateY(6px);animation:pop .45s cubic-bezier(.2,1.3,.4,1) forwards}
  .stars svg:nth-child(1){animation-delay:.05s}
  .stars svg:nth-child(2){animation-delay:.15s}
  .stars svg:nth-child(3){animation-delay:.25s}
  .stars svg:nth-child(4){animation-delay:.35s}
  .stars svg:nth-child(5){animation-delay:.45s}
  @keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}

  h1{font-family:var(--font-title);font-weight:600;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.15;
    margin:0 0 14px;letter-spacing:-.01em}
  h1 .hl{color:var(--red)}
  p.lead{color:var(--ink-soft);font-size:1.08rem;margin:0 auto 30px;max-width:400px}
  p.lead b{color:var(--ink)}

  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    font-family:var(--font-title);font-weight:600;font-size:1.18rem;color:#fff;background:var(--red);
    padding:19px 24px;border-radius:999px;text-decoration:none;
    box-shadow:0 14px 30px rgba(207,25,12,.34);transition:transform .18s,box-shadow .18s,background .18s}
  .btn:hover{background:var(--red-dark);transform:translateY(-3px);box-shadow:0 20px 38px rgba(207,25,12,.44)}
  .btn:active{transform:translateY(-1px)}
  .btn .g{width:26px;height:26px;flex:none;background:#fff;border-radius:50%;padding:4px;display:grid;place-items:center}
  .btn .g svg{width:100%;height:100%;display:block}

  .note{margin-top:18px;font-weight:800;font-size:.95rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px}
  .note .clock{width:20px;height:20px;fill:none;stroke:var(--gold-deep);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .thanks{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .thanks .hola{font-family:var(--font-title);font-weight:500;color:var(--gold-deep);font-size:1.15rem}
  .thanks .sig{font-family:var(--font-title);font-weight:600;color:var(--red);font-size:1.2rem;margin-top:2px}

  @media (max-width:480px){
    .card{padding:36px 22px 30px;border-radius:26px}
    .stars svg{width:32px;height:32px}
    .logo{width:84px}
  }
</style>
</head>
<body>
<div class="flag"></div>

<div class="hero-wrap">
<main class="card">
  <img class="logo" src="../assets/img/logo.png" alt="Espanhol com Claudia">
  <div class="brand">Espanhol <span>com Claudia</span></div>

  <div class="stars" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
  </div>

  <h1>Gostou de aprender <span class="hl">espanhol</span> comigo?</h1>
  <p class="lead">Sua avaliação me ajuda demais e faz com que <b>mais pessoas</b> encontrem as aulas. Conta pra todo mundo como foi a sua experiência! </p>

    Avaliar no Google
  </a>

  <div class="note">
    <svg class="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    Leva menos de 1 minuto
  </div>

  <div class="thanks">
    <div class="hola">¡Muchas gracias!</div>
    <div class="sig">Claudia</div>
  </div>
</main>
</div>

<section class="reviews">
  <h2 class="reviews-title">O que dizem meus alunos</h2>

</section>

</body>
</html>
